<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- http://getbootstrap.com/docs/5.3/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <link href="/static/styles.css" rel="stylesheet">

        <title>Biblioteca Personal</title>

    </head>

    <body>
        <nav class="bg-light border navbar navbar-expand-md navbar-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="/"><span class="red">Biblioteca</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    {% if session["user_id"] %}
                        <form class="d-flex flex-column" role="search" action="/search" method="post" style="max-width: 350px;">
                            <div class="input-group flex-nowrap">
                                <input class="form-control" type="search" name="query" placeholder="Buscar libro o autor..." aria-label="Search">
                                <button class="btn btn-outline-light" type="submit">Buscar</button>
                            </div>
                            <div class="d-flex gap-3 mt-1">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="searchType" id="radioTitulo" value="titulo" checked>
                                    <label class="form-check-label text-white-50" for="radioTitulo">Titulo</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="searchType" id="radioAutor" value="autor">
                                    <label class="form-check-label text-white-50" for="radioAutor">Autor</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="searchType" id="radioGenero" value="genero">
                                    <label class="form-check-label text-white-50" for="radioGenero">Genero</label>
                                </div>
                            </div>
                        </form>
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="/logout">Salir</a></li>
                        </ul>
                    {% else %}
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="/register">Registarse</a></li>
                            <li class="nav-item"><a class="nav-link" href="/login">Ingresar</a></li>
                        </ul>
                    {% endif %}
                </div>
            </div>
        </nav>

        {% if get_flashed_messages() %}
            <header>
                <div class="alert alert-primary mb-0 text-center" role="alert">
                    {{ get_flashed_messages() | join(" ") }}
                </div>
            </header>
        {% endif %}

        <main class="container-fluid d-flex flex-column" style="min-height: calc(100vh - 76px);">
            {% block main %}{% endblock %}
        </main>
        {% block scripts %}{% endblock %}
    </body>
