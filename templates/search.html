{% extends "layout.html" %}

{% block main %}
<div id="libros-container" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3 mt-3">
    {%for libro in libros%}
        <div class="col">
            <div class="book-card card h-100 d-flex flex-column" data-key="{{libro.key}}" data-title="{{libro.titulo}}" data-author="{{libro.autor}}" data-portada="{{libro.portada}}">
                <!-- VISTA INICIAL -->
                <div class="card-inicial flex-grow-1" id="inicial-{{loop.index}}">
                    <div class="row g-0 h-100">
                        <div class="col-5 d-flex">
                            <img src="{{libro.portada}}" class="img-fluid rounded-start" alt="{{libro.titulo}}" style="object-fit: cover; width: 100%; height: 100%;">
                        </div>
                        <div class="col-7 d-flex flex-column">
                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title mb-1">{{libro.titulo}}</h6>
                                <p class="card-text mb-2 small">{{libro.autor}}</p>
                                <button class="btn btn-primary btn-sm mt-auto align-self-start" data-id="{{loop.index}}" data-action="detalle">Ver descripción</button>                               
                                <button class="btn btn-success btn-sm mt-1 align-self-start" data-id="{{loop.index}}" data-action="agregar">Agregar a biblioteca</button>                            
                            </div>
                        </div>
                    </div>
                </div>
                <!-- VISTA DETALLE -->
                <div class="card-detalle d-none" id="detalle-{{loop.index}}">
                    <div class="card-body">
                        <button class="btn btn-outline-secondary btn-sm mt-2" data-id="{{loop.index}}" data-action="inicial">Volver</button>
                    </div>
                </div>
            </div>
        </div>
    {%endfor%}
</div>

<!-- Modal -->
<div class="modal fade" id="modal-libro" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-titulo"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-4">
                        <img id="modal-portada" class="img-fluid rounded" src="" alt="">
                    </div>
                    <div class="col-8">
                        <p id="modal-autor" class="mb-2"></p>
                        <div class="d-flex gap-2"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <select id="estado">
                    <option value="estado" selected disabled>Estado</option>
                    <option value="deseado">Deseado</option>
                    <option value="en-progreso">En progreso</option>
                    <option value="terminado">Terminado</option>
                </select>
                <button type="button" class="btn btn-primary" id="btn-agregar">Agregar</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>

let currentBook = null;
function abrirModal(card) {
    currentBook = {
        key: card.dataset.key,
        title: card.dataset.title,
        author: card.dataset.author,
        portada: card.dataset.portada
    };
    const modal = document.getElementById('modal-libro');

    modal.querySelector('#modal-titulo').textContent = card.dataset.title;
    modal.querySelector('#modal-autor').textContent = card.dataset.author;
    modal.querySelector('#modal-portada').src = card.dataset.portada;

    new bootstrap.Modal(modal).show();
}

document.getElementById('libros-container').addEventListener('click', function(e) {
    const btn = e.target.closest('[data-id]');

    if (!btn) return;

    const id = btn.dataset.id;

    if (btn.dataset.action === 'detalle') {
        document.getElementById('inicial-' + id).classList.add('d-none');
        document.getElementById('detalle-' + id).classList.remove('d-none');
    } else if (btn.dataset.action === 'inicial') {
        document.getElementById('detalle-' + id).classList.add('d-none');
        document.getElementById('inicial-' + id).classList.remove('d-none');
    } else if (btn.dataset.action === 'agregar') {
        const card = btn.closest('.book-card');
        abrirModal(card)
    }
});

<!-- Envio a Flask -->
document.getElementById("btn-agregar").addEventListener("click", async () => {
    const estado = document.getElementById("estado").value;

    if (!estado) return;

    const response = await fetch("/agregar-libro", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            key: currentBook.key,
            titulo: currentBook.title,
            autor: currentBook.author,
            portada: currentBook.portada,
            estado: estado
        })
    });

    const data = await response.json();

    if (data.ok) {
        bootstrap.Modal.getInstance(document.getElementById('modal-libro')).hide();
    }
});
</script>
{% endblock %}
