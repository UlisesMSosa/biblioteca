{% extends "layout.html" %}

{% block main %}
<div class="d-flex justify-content-center mt-3">
    <form class="w-50 bg-dark text-white rounded" role="search" action="/search" method="post" style="padding: 5px;">
        <div class="input-group">
            <input class="form-control" type="search" name="query" placeholder="Buscar libro o autor..." aria-label="Search">
            <button class="btn btn-outline-primary" type="submit">Buscar</button>
        </div>
        <div class="d-flex justify-content-start gap-3 mt-2">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="searchType" id="radioTitulo" value="titulo" checked>
                <label class="form-check-label" for="radioTitulo">Titulo</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="searchType" id="radioAutor" value="autor">
                <label class="form-check-label" for="radioAutor">Autor</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="searchType" id="radioGenero" value="genero">
                <label class="form-check-label" for="radioGenero">Genero</label>
            </div>
        </div>
    </form>
</div>
<div id="libros-container" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3 mt-3 align-items-start">
    {%for libro in libros%}
        <div class="col">
            <div class="card">
                <!-- VISTA INICIAL -->
                <div class="card-inicial" id="inicial-{{loop.index}}">
                    <div class="row g-0 h-100">
                        <div class="col-5 d-flex">
                            <img src="{{libro.imagen}}" class="img-fluid rounded-start" alt="{{libro.titulo}}" style="object-fit: cover; width: 100%; height: 100%;">
                        </div>
                        <div class="col-7 d-flex flex-column">
                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title mb-1">{{libro.titulo}}</h6>
                                <p class="card-text mb-2 small">{{libro.autores | join(", ")}}</p>
                                <button class="btn btn-primary btn-sm mt-auto align-self-start" onclick="mostrarDetalle({{loop.index}})">Ver descripción</button>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- VISTA DETALLE -->
                <div class="card-detalle d-none" id="detalle-{{loop.index}}">
                    <div class="card-body">
                        <p class="mb-1"><strong>Descripción:</strong> {{libro.descripcion}}</p>
                        <p class="mb-1"><strong>Páginas:</strong> {{libro.paginas}}</p>
                        <p class="mb-1"><strong>ISBN:</strong> {{libro.ISBN}}</p>
                        <button class="btn btn-outline-secondary btn-sm mt-2" onclick="mostrarInicial({{loop.index}})">Volver</button>
                    </div>
                </div>
            </div>
        </div>
    {%endfor%}
</div>
{% endblock %}

{% block scripts %}
<script>
function mostrarDetalle(id) {
    document.getElementById('inicial-' + id).classList.add('d-none');
    document.getElementById('detalle-' + id).classList.remove('d-none');
}

function mostrarInicial(id) {
    document.getElementById('detalle-' + id).classList.add('d-none');
    document.getElementById('inicial-' + id).classList.remove('d-none');
}
</script>
{% endblock %}
